      - scripts/extract_sections.py
      - source-map/extract-map.yaml
      - source-map/section-ownership.yaml
      - source-map/release-scope-v0.1.yaml
      - source-map/atlas-snapshot.json
    extraction_scope: source-map/release-scope-v0.1.yaml
    provenance_root: inbox-provenance-2026-08-31/СТАТЬИ
    historical_non_runtime_roots: [evals, inbox-provenance-2026-08-31]
skill: infographic-designer
modules:
  screenshot-explainer:
    entrypoint: modules/screenshot-explainer/SKILL.md
    purpose: plan_decompose_and_annotate_real_ui_screenshots
public_routes: [create, audit, repair]
skeletons: [hero-callouts, exploded-axis, layered-stack, linear-sequence, timeline, node-link, nested-containers, small-multiples]
style_profiles: [technical-line-art, editorial, editorial-engineering-spread, scientific-atlas, clean-sketchnote]
renderer_routes: [diagram-first, chart-first, guided-generation, hybrid-structured]
contracts:
  - production-contract
  - content-packet
  - semantic-spec
  - visual-spec
  - style-profile
  - render-brief
  - edit-contract
  - temporal-spec
  - qa-contract
  - qa-report
playbooks: [create, audit, repair]
curated_prompts: [semantic-designer, visual-architect, render-brief-compiler, independent-critic, comprehension-critic, repair-planner]
examples:
  create: [gpu-callouts, rag-architecture, benchmark-story]
  audit: [reversed-edge-invented-node]
  repair: [rag-minimal-patch]
tests:
  minimum_routing_cases: 30
  require_positive_negative_boundary_routes: true
  require_each_blocker_fixture: true
  minimum_assertions_per_regression: 3
source_map:
  expected_sections: 187
  expected_sources: 10
  generated_targets_must_match: true
policy:
  one_owner_per_target: true
  gate_membership_owned_by: rules/registry.yaml
  score_only_after_blocker_gate: true
  style_after_g2: true
  publishable_absolute_paths_forbidden: true
