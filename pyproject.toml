[project]
name = "aimedia"
version = "0.1.0"
description = "Локальный CLI-инструмент генерации изображений через Polza"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "aimedia" }]
dependencies = [
    "platformdirs>=4.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.15",
]

[project.scripts]
aimedia = "aimedia.cli.app:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aimedia"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Каталог процессно-независимой offline-политики доступен и conftest, и тестам.
pythonpath = ["tests/offline"]
markers = [
    "live: реальный вызов provider; только по явному разрешению",
    "slow: длительная проверка",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# Плановая документация содержит Python в примерах; она не является кодом проекта
# и не переформатируется инструментами качества.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/aimedia"]

[[tool.mypy.overrides]]
module = ["typer.*"]
ignore_missing_imports = true
